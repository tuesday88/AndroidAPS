name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: |
        export storePassword=${{ secrets.STORE_PASSWORD }}
        export keyAlias=${{ secrets.KEY_ALIAS }}
        export keyPassword=${{ secrets.KEY_PASSWORD }}
        export storeFile=${{ secrets.STORE_FILE }}
        ./gradlew assembleFullRelease
        
    # 添加验证步骤
    - name: Verify build outputs
      run: |
        echo "Build outputs:"
        find . -name '*.apk' -ls
        mkdir -p verification && touch verification/apk-exists
        
    # 使用路径变量
    - name: Locate release APKs
      id: locate-apk
      run: |
        echo "apk_path=$(find . -path '*/full/release/*.apk' -print -quit)" >> $GITHUB_OUTPUT
        echo "Found APK at: ${{ steps.locate-apk.outputs.apk_path }}"
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aaps
        path: ${{ steps.locate-apk.outputs.apk_path }}
        overwrite: true
        retention-days: 7
